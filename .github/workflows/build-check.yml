name: Build Check (temporary - validates jekyll build)
on:
  workflow_dispatch:
  push:
    branches: ["master"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify publications rendered
        run: |
          echo "--- publication pages generated ---"
          find _site -path '*publication*' -name '*.html' | sort
          echo "--- titles on /publications/ index ---"
          grep -oE "SynLogic|Perception Bottleneck|Truthfulness Hyperplane|In-Context Sharpness|C-Eval|Composing Parameter-Efficient" _site/publications/index.html | sort | uniq -c
          echo "--- titles on homepage ---"
          grep -oE "SynLogic|Perception Bottleneck|Truthfulness Hyperplane|In-Context Sharpness|C-Eval|Composing Parameter-Efficient" _site/index.html | sort | uniq -c
          echo "--- sidebar author checks on homepage ---"
          grep -oE "jliugi@connect.ust.hk|Vicent0205|junteng88716710|Zhiyuan Honor Scholarship" _site/index.html | sort | uniq -c
